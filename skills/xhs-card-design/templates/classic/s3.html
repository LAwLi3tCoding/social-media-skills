<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
body{font-family:"Noto Sans CJK SC";color:#3E3355}
.page{background:linear-gradient(#FCEEDD,#FEF1E1 40%,#FBEAD6);padding:44px 56px 34px;display:flex;flex-direction:column;justify-content:space-between}
.clay{border-radius:44px;box-shadow:inset -10px -12px 20px rgba(80,50,30,.10),inset 10px 10px 18px rgba(255,255,255,.75),14px 18px 34px rgba(140,100,70,.20)}
.top{display:flex;justify-content:space-between;align-items:center}
.badge{background:#CDBEF0;padding:12px 28px;font-size:30px;font-weight:700;color:#4B3B7A}
.pn{background:#A9E4D2;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:KuaiLe;font-size:44px;color:#2E6B5A}
.hero{position:relative;height:500px;margin:0 -56px}
.hero img{position:absolute;right:-30px;top:-10px;width:720px;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 52%,#000 70%,transparent 100%)}
.hero h1{position:absolute;left:56px;top:30px;font-family:KuaiLe;font-weight:400;font-size:112px;line-height:1.12;color:#4B3B7A;text-shadow:0 6px 0 #E3D6F7,0 10px 18px rgba(120,90,160,.25)}
.hero h1 span{color:#E07A8C;text-shadow:0 6px 0 #F9D4DA,0 10px 18px rgba(200,100,120,.25)}
.lead{position:absolute;left:56px;bottom:10px;width:440px;background:#FFFDF8;padding:26px 30px;font-size:34px;line-height:1.5;font-weight:500}
.flow{display:flex;align-items:center;gap:16px}
.flow .s{flex:1;text-align:center;font-family:KuaiLe;font-size:42px;padding:16px 0;border-radius:60px}
.flow i{font-style:normal;font-size:40px;color:#B29BD9}
.vs{display:flex;gap:60px;position:relative}
.card{flex:1;padding:30px 32px 34px}
.card h3{font-family:KuaiLe;font-weight:400;font-size:46px;margin-bottom:12px}
.card p{font-size:34px;line-height:1.5}
.ball{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:#F7C873;font-family:KuaiLe;font-size:42px;display:flex;align-items:center;justify-content:center;color:#7A4B12}
.pair{display:flex;gap:26px}
.pill{flex:1;padding:24px 30px;font-size:34px;line-height:1.45;font-weight:700}
.note{font-size:28px;line-height:1.5;color:#6E6283;padding:0 8px}
.foot{display:flex;justify-content:space-between;font-size:24px;color:#9A8CAF}
</style></head><body><div class="page">
<div class="top"><span class="badge clay">示例合集 · 01</span><span class="pn clay">02</span></div>
<div class="hero"><img src="assets/clay.jpg"><h1>AI 是程序<br><span>不是生命</span></h1>
 <div class="lead clay">AI 本质上是电脑里运行的程序。你给它输入，它经过计算，给你一个结果。</div></div>
<div class="flow"><span class="s clay" style="background:#FDE7B8">输入</span><i>●●</i><span class="s clay" style="background:#DCD0F7">计算</span><i>●●</i><span class="s clay" style="background:#BDEBDD">结果</span></div>
<div class="vs"><div class="card clay" style="background:#FFFDF8"><h3 style="color:#8A7A9E">普通程序</h3><p>怎么做事，全靠人提前把规则一条条写好。</p></div>
<div class="card clay" style="background:#CDBEF0"><h3 style="color:#4B3B7A">现在大多数 AI</h3><p>人给它大量数据，它自己从里面找出规律。</p></div><div class="ball clay">VS</div></div>
<div class="pair"><div class="pill clay" style="background:#F9CFD6;color:#8A2E44">它没有意识，<br>也没有感受。</div><div class="pill clay" style="background:#BDEBDD;color:#225C4C">它能写出带情绪的话，<br>但它自己没有情绪。</div></div>
<div class="note">早期也有不少 AI 是靠人写规则做出来的，所以 AI 不全是机器学习。</div>
<div class="foot"><span>来源：IBM · John McCarthy · Google</span><span>◍ ◍ ◍</span></div>
</div></body></html>

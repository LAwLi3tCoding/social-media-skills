<div class="top"><div class="tag">示例合集 · 01</div><div class="pn">02</div></div>
<div class="title"><div class="robot"><img src="assets/brutal.jpg"></div><h1><span class="hl">AI 是程序</span><br><span class="no">不是生命</span></h1></div>
<div class="row">
 <div class="lead">AI 本质上是<b>电脑里运行的程序</b>。你给它输入，它经过计算，给你一个结果。
  <div class="flow"><span style="background:#FECA57">输入</span><i>→</i><span style="background:#A29BFE">计算</span><i>→</i><span style="background:#00D2D3">结果</span></div></div>
</div>
<div class="vs">
 <div class="col a"><h3>普通程序</h3><p>怎么做事，全靠人提前把规则一条条写好。</p></div>
 <div class="col b"><h3>现在大多数 AI</h3><p>人给它大量数据，它自己从里面找出规律。</p></div>
 <div class="vsb">VS</div>
</div>
<div class="no2">
 <div class="st">它没有意识，<br>也没有感受。</div>
 <div class="st2">它能写出带情绪的话，但它自己没有情绪。</div>
</div>
<div class="note">早期也有不少 AI 是靠人写规则做出来的，所以 AI 不全是机器学习。</div>
<div class="foot"><span>来源：IBM · John McCarthy · Google</span><span>★ ★ ★</span></div>

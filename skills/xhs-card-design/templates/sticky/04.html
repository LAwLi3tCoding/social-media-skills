<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:XL;src:url(__FONTS_DIR__/xiaolai.ttf)}
@font-face{font-family:WK;src:url(__FONTS_DIR__/wenkai.ttf)}
@font-face{font-family:IN;src:url(file:///usr/share/fonts/truetype/sand-box/google/Inter/Inter-VariableFont_opsz,wght.ttf);font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1440px;overflow:hidden}
.page{width:1080px;height:1440px;position:relative;overflow:hidden;color:#3B2E29;font-family:WK,sans-serif;
  background-color:#FFFBF2;background-image:linear-gradient(#BFD9EE55 1.5px,transparent 1.5px),linear-gradient(90deg,#BFD9EE55 1.5px,transparent 1.5px);background-size:40px 40px;
  padding:44px 52px 0;display:flex;flex-direction:column}
.en{font-family:IN,sans-serif;font-weight:700}
.cmd{font-family:IN,sans-serif;font-weight:650;letter-spacing:-.03em;word-break:break-all}
.tape{position:absolute;height:42px;opacity:.88;box-shadow:0 2px 4px #0001;z-index:4;pointer-events:none}
.tape.pink{background:repeating-linear-gradient(45deg,#F8C8D0 0 12px,#FBD9DF 12px 24px)}
.tape.mint{background:repeating-linear-gradient(45deg,#C9EEDD 0 12px,#DDF5EA 12px 24px)}
.tape.butter{background:repeating-linear-gradient(45deg,#F6E2A8 0 12px,#FBF0C8 12px 24px)}
.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;flex:none}
.badge{font-family:XL;font-size:28px;padding:8px 26px;background-color:#D8ECFA;transform:rotate(-2deg);box-shadow:0 3px 6px #8a6a5020}
.pn{width:86px;height:86px;border-radius:50%;background-color:#FFF0C2;border:5px solid #fff;box-shadow:0 3px 10px #8a6a5028;font-family:XL;font-size:26px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
h1.word{font-family:IN,sans-serif;font-weight:800;font-size:92px;line-height:.95;letter-spacing:-.04em;color:#2A221E;margin-top:10px;flex:none}
.sub{font-family:XL;font-size:40px;line-height:1.3;margin-top:10px}
.sub .mk{background:linear-gradient(transparent 58%,#FFD3DC 58%,#FFD3DC 94%,transparent 94%);padding:0 4px}
.note{position:relative;padding:34px 24px 20px;box-shadow:3px 8px 16px #8a6a5030;font-size:28px;line-height:1.5;
  background-image:repeating-linear-gradient(transparent 0 30px,rgba(90,60,50,.35) 30px 32px);background-position:0 40px}
.note h3{font-family:XL;font-weight:400;font-size:34px;margin-bottom:6px}
.note p,.note .body{font-family:WK;font-size:26px;line-height:1.5}
.note .tp{position:absolute;top:-16px;left:50%;width:130px;height:36px;margin-left:-65px;background-color:#ffffffc8;border:1px solid #0000000d;box-shadow:0 1px 2px #0001}
.sheet{background-color:#fff;border-radius:8px;box-shadow:0 6px 16px #8a6a5020;padding:18px 26px 18px 64px;position:relative;flex:none;
  background-image:repeating-linear-gradient(transparent 0 46px,#F2D7C9 46px 48px);background-position:0 16px;font-size:26px;line-height:46px;margin-top:14px}
.sheet:before{content:"";position:absolute;left:22px;top:16px;bottom:16px;width:16px;background:radial-gradient(circle,#EADBC8 6px,transparent 7px) 0 0/16px 46px}
.row{display:flex;gap:20px;align-items:stretch}
.mini{padding:16px 14px 18px;box-shadow:3px 6px 12px #8a6a5026;font-family:XL;font-size:28px;text-align:center}
.lead{font-size:28px;line-height:1.5;margin:8px 0 4px;flex:none}
.h{font-family:XL;font-size:52px;line-height:1.2;margin-top:12px;flex:none}
.mid{flex:1 1 auto;display:flex;flex-direction:column;gap:22px;min-height:0;margin-top:14px;margin-bottom:12px}
.mid .note{flex:1 1 auto}
.mid .chips{flex:0 0 auto}
.foot{flex:none;padding:14px 52px 18px;display:flex;justify-content:space-between;font-size:22px;color:#6d5c52;background-color:#FFF6E8;border-top:2px dashed #E8B9A8;margin-left:-52px;margin-right:-52px}
</style></head><body>
<div class="page">

<div class="tape butter" style="width:200px;left:-28px;top:36px;transform:rotate(-30deg)"></div>
<div class="tape mint" style="width:170px;right:-40px;top:64px;transform:rotate(26deg)"></div>
<div class="top"><span class="badge">示例合集 · 06</span><span class="pn">04 / 06</span></div>
<div class="h">同目录附了配套方法</div>
<div class="lead">这些方法附在 systematic-debugging 同一个目录里。</div>

<div class="mid">
<div class="row" style="flex:1">
  <div class="note" style="background-color:#D8ECFA;flex:1;transform:rotate(-0.8deg)">
    <span class="tp" style="transform:rotate(-3deg)"></span>
    <h3>往回追源头</h3>
    <p>顺着调用栈往回追源头。</p>
  </div>
  <div class="note" style="background-color:#D3EFE2;flex:1;transform:rotate(0.8deg)">
    <span class="tp" style="transform:rotate(3deg)"></span>
    <h3>每层加校验</h3>
    <p>修好后在每层加校验。</p>
  </div>
</div>
<div class="row" style="flex:1">
  <div class="note" style="background-color:#FFF0C2;flex:1;transform:rotate(0.7deg)">
    <span class="tp" style="transform:rotate(-2deg)"></span>
    <h3>条件轮询</h3>
    <p>用条件轮询换掉固定 sleep。</p>
  </div>
  <div class="note" style="background-color:#FAD7DF;flex:1;transform:rotate(-0.7deg)">
    <span class="tp" style="transform:rotate(3deg)"></span>
    <h3>找污染测试</h3>
    <p>另有一份逐个跑测试找出污染测试的脚本。</p>
  </div>
</div>
<div class="note" style="background-color:#E5DBF5;transform:rotate(-0.4deg);flex:0.42 1 auto">
  <span class="tp" style="transform:rotate(2deg)"></span>
  <h3>都在同一个目录里</h3>
  <p>同目录附了配套方法：顺着调用栈往回追源头，修好后在每层加校验，用条件轮询换掉固定 sleep，另有一份逐个跑测试找出污染测试的脚本。</p>
</div>
</div>

<div class="foot"><span>来源：obra/superpowers</span><span>MIT 协议</span></div>
</div></body></html>

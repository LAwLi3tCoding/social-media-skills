<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><style>
/* 收尾页：存档大对话框 + 延伸 */
.save{background:#020D2B;color:#fff;padding:26px 34px 30px;position:relative;

.chat{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:stretch}

.bub.u{background:var(--yellow)}.bub.u:after{left:30px}
.bub.a{background:var(--sky)}.bub.a:after{right:30px}
.txt{font-size:32px;line-height:1.6}
.icons{display:flex;gap:18px;align-items:center;justify-content:space-between;background:#fff;padding:14px 24px}
.icons img{height:72px}
.icons .t{font-size:32px;font-weight:900;flex:none}
.next{display:flex;gap:18px;align-items:center;background:var(--ink);color:#fff;padding:16px 24px;font-size:30px;line-height:1.5}
.next .k{font-family:Pixel;color:var(--yellow);flex:none;font-size:30px}

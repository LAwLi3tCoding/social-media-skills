<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><style>
/* 内页：场景大图 + 能/不能两栏 + 警告框 */
.scene{height:470px;background:url(img/p03_fork.jpg) center 62%/cover}
.scene .ttl{position:absolute;left:0;right:0;top:0;padding:22px 36px 26px;background:linear-gradient(var(--night) 70%,transparent)}
.scene h1{font-size:80px}
.two{display:flex;gap:30px}

.cmp div{flex:1;text-align:center;padding:8px 6px;font-size:28px;font-weight:700;line-height:1.4}
.warn{display:flex;align-items:center;gap:26px;background:var(--red);color:#fff;padding:22px 30px}
.warn .ex{font-family:Pixel;flex:none;width:84px;height:84px;background:var(--yellow);color:var(--ink);font-size:64px;display:flex;align-items:center;justify-content:center}

.warn .k{font-family:Pixel;font-size:26px;color:var(--yellow);display:block;margin-bottom:4px}
.col .br{display:block;width:100%;height:70px;object-fit:cover;margin-top:auto}
</style></head><body><div class="page">

<div class="two">
 <div class="col px"><div class="h" style="color:#2F8F4E"><i style="background:#2F8F4E">✓</i>能做到</div><div style="margin-bottom:14px">从数据里学到规律后，AI 能处理它没见过的新问题，不用人把每种情况都写一遍。</div><img class="br px" src="img/p03_flag.jpg"></div>

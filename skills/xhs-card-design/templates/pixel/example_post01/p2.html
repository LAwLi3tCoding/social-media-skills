<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><style>
/* 内页：上半「是什么」，下半「对战对照」 */
.scr{height:268px;padding:22px 36px 0}
.scr h1{font-size:78px}
.scr .robot{position:absolute;right:270px;bottom:22px;height:196px}
.scr .pc{position:absolute;right:24px;bottom:22px;height:158px}
.star{position:absolute;width:6px;height:6px;background:#fff}
.ml{display:flex;align-items:center;gap:22px;background:var(--cream);padding:16px 24px;font-size:34px;line-height:1.5}
.ml .tag{font-family:Pixel;background:var(--ink);color:var(--yellow);padding:2px 14px;font-size:30px;flex:none}
.ml .sm{font-size:26px;color:#3d4166;line-height:1.5;margin-top:2px}
.dlg,.it,.p{font-size:32px}
.dlg{padding:16px 28px 22px}
.it{padding:16px 22px}
.p{padding:16px 22px 20px}
</style></head><body><div class="page">
<div class="top pix"><span class="badge px">示例合集 · 01</span><span class="pn px">2 / 4</span></div>
<div class="screen scr px"><h1>AI 是程序<br><span class="g">不是生命</span></h1>
 <img class="robot" src="../assets/px_robot.png"><img class="pc" src="../assets/px_pc.png">
 <div class="star" style="left:600px;top:40px"></div><div class="star" style="left:760px;top:70px"></div><div class="star" style="left:950px;top:30px;background:var(--green)"></div><div class="star" style="left:690px;top:120px;background:var(--yellow)"></div>
 <div class="ground"></div></div>
<div class="dlg px"><span class="who">提示</span><br>AI 本质上是电脑里运行的程序。你给它输入，它经过计算，给你一个结果。
 <div class="flow"><b class="px" style="background:var(--yellow)">输入</b><i>▶▶</i><b class="px" style="background:var(--sky)">计算</b><i>▶▶</i><b class="px" style="background:var(--green)">结果</b></div></div>
<div class="pair">
 <div class="it px" style="background:var(--pink)"><span class="ic x"><img src="../assets/px_heart.png"></span><div>它没有意识，<br>也没有感受。</div></div>
 <div class="it px" style="background:var(--mint)"><span class="ic"><img src="../assets/px_star.png"></span><div>它能写出带情绪的话，<br>但它自己没有情绪。</div></div></div>
<div class="sec">▶ 它的本事从哪来？</div>
<div class="vs">
 <div class="p px" style="color:var(--red)"><div class="h">1P 普通程序</div><div class="bar"></div><div style="color:var(--ink)">普通程序怎么做事，全靠人提前把规则一条条写好。</div></div>
 <div class="p px" style="color:var(--blue)"><div class="h">2P 现在大多数 AI</div><div class="bar"></div><div style="color:var(--ink)">现在大多数 AI 不一样：人给它大量数据，它自己从里面找出规律。</div></div>
 <div class="vsb">VS</div></div>
<div class="ml px"><span class="tag">新词</span><div>这种做法叫「机器学习」。<div class="sm">早期也有不少 AI 是靠人写规则做出来的，所以 AI 不全是机器学习。</div></div></div>
<div class="foot"><span>来源：IBM · John McCarthy · Google</span><span class="pix">■ ■ □ □</span></div>
</div></body></html>
